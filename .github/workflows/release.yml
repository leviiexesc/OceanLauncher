name: Release build

on:
  workflow_dispatch

jobs:
  build:
    name: Release build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
          - platform: 3
            platform_name: tvos
          - platform: 7
            platform_name: iossimulator
          - platform: 8
            platform_name: tvossimulator
    
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # provision the stable zulu jdk 8 runtime environment as structured in the upstream core
      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '8'

      # initialize essential building and packaging utilities via homebrew infrastructure
      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install make wget ldid
          sudo mkdir -p /usr/local/bin
          # map the gmake binary symlink seamlessly across the target build runner paths
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake

      - name: Cache iOS JREs
        id: cache-jres
        uses: actions/cache@v5
        with:
          path: depends/
          key: amethyst-jres-v1

      # resolve and inject core environmental paths and flags directly into the global execution scope
      - name: Resolve env (paths, SDK)
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "RUNNER=1" >> $GITHUB_ENV

      - name: Build for ${{ matrix.platform_name }}
        shell: bash
        run: |
          # Apply the mach/mach.h fix required for Zenith Launcher
          echo '#import <mach/mach.h>' | cat - Natives/JavaLauncher.m > temp && mv temp Natives/JavaLauncher.m
          
          JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
          export PATH="$JDK_BASE_PATH/bin:/opt/homebrew/bin:$PATH"
          export JAVA_HOME="$JDK_BASE_PATH"
          export BOOTJDK="$JDK_BASE_PATH/bin"
          export SLIMMED=1
          
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export CFLAGS="-Wno-error=implicit-function-declaration $CFLAGS"
          export CXXFLAGS="-Wno-error=implicit-function-declaration $CXXFLAGS"
          SIGN_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
          fi

      - name: List artifacts
        if: always()
        run: ls -la artifacts/ || true

      - name: Upload regular ipa
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: com.thenullastris.zenithlauncher-${{ matrix.platform_name }}
          path: artifacts/com.thenullastris.zenithlauncher-*-${{ matrix.platform_name }}.ipa
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular tipa
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: com.thenullastris.zenithlauncher-${{ matrix.platform_name }}-trollstore
          path: artifacts/com.thenullastris.zenithlauncher-*-${{ matrix.platform_name }}-trollstore.tipa
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0

      - name: Upload dSYM
        if: always() && matrix.platform_name == 'ios'
        uses: actions/upload-artifact@v5
        with:
          name: com.thenullastris.zenithlauncher-dSYM
          path: artifacts/*.dSYM
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
