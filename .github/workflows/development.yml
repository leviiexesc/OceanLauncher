name: Development build

on:
  workflow_dispatch: # Only manual trigger allowed

jobs:
  build:
    name: Development build
    # FIXED: Restored fast macos-14 runner execution scope
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # provision the stable zulu jdk 8 runtime environment as structured in the upstream core
      # FIXED: Added the mandatory hyphen (-) and architecture restriction to ensure Rosetta 2 compatibility
      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '8'
          architecture: x64

      # initialize essential building and packaging utilities via homebrew infrastructure
      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install make wget ldid
          sudo mkdir -p /usr/local/bin
          # map the gmake binary symlink seamlessly across the target build runner paths
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake
      - name: Cache iOS JREs
        id: cache-jres
        uses: actions/cache@v5
        with:
          path: depends/
          key: amethyst-jres-v1

      # resolve and inject core environmental paths and flags directly into the global execution scope
      - name: Resolve env (paths, SDK)
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "RUNNER=0" >> $GITHUB_ENV
      - name: Verify tools
        run: |
          gmake --version | head -1
          ldid -V 2>&1 | head -1 || true
          cmake --version | head -1
          wget --version | head -1
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDKPATH=$SDKPATH"
      # Trigger gmake compilation pipelines with inline stderr filtering and execute post-build binary optimization
      - name: Build sideload IPA & TrollStore tIPA
        shell: bash
        run: |
          echo '#import <mach/mach.h>' | cat - Natives/JavaLauncher.m > temp && mv temp Natives/JavaLauncher.m
          JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
          export PATH="$JDK_BASE_PATH/bin:/opt/homebrew/bin:$PATH"
          export JAVA_HOME="$JDK_BASE_PATH"
          export BOOTJDK="$JDK_BASE_PATH/bin"
          
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          
          # FIXED: Added -Wno-error=int-to-pointer-cast to prevent 64-bit casting warnings from crashing the compiler
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=int-to-pointer-cast $CFLAGS"
          export CXXFLAGS="-Wno-error=implicit-function-declaration -Wno-error=int-to-pointer-cast $CXXFLAGS"
          
          SIGN_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          # Only run package (removed dsym and slimmed)
          gmake -j1 --output-sync=target package PLATFORM=2 $SIGN_FLAGS 2>&1 | tee development-build.log
          test ${PIPESTATUS[0]} -eq 0
          
          gmake -j1 --output-sync=target package PLATFORM=2 TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2>&1 | tee development-trollstore-build.log
          test ${PIPESTATUS[0]} -eq 0
      - name: List artifacts
        if: always()
        run: ls -la artifacts/ || true

      - name: Upload TrollStore tIPA (full)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: com.oceanlauncher.minecraft-ios-trollstore
          path: artifacts/com.oceanlauncher.minecraft-*-ios-trollstore.tipa
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (full)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: com.oceanlauncher.minecraft-ios
          path: artifacts/com.oceanlauncher.minecraft-*-ios.ipa
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      # extract local compilation cmake diagnostic records upon unexpected pipeline failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            development-build.log
            development-trollstore-build.log
            Natives/build/CMakeFiles/CMakeOutput.log
            Natives/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 1
